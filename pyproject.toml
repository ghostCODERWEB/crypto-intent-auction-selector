[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-intent-auction-selector"
version = "0.1.0"
description = "Validate solver offers against deadlines and minimum output and select net output after declared costs."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-intent-auction-selector = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
